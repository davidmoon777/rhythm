<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문유리듬</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 메뉴 화면 -->
<div id="menu">
<h1>문유리듬</h1>
<button id="startBtn">게임 시작</button>
</div>

<!-- 난이도 선택 -->
<div id="difficulty" style="display:none">
<h2>난이도 선택</h2>
<button class="diffBtn" data-speed="3">이지</button>
<button class="diffBtn" data-speed="5">노말</button>
<button class="diffBtn" data-speed="7">하드</button>
</div>

<!-- 게임 화면 -->
<div id="game" style="display:none">
<div id="ui">
<div id="score">Score: 0</div>
<div id="combo">Combo: 0</div>
<div id="accuracy">Accuracy: 100%</div>
</div>

<div id="judgement"></div>

<div id="lanes">
<div class="lane" data-key="0"></div>
<div class="lane" data-key="1"></div>
<div class="lane" data-key="2"></div>
<div class="lane" data-key="3"></div>
</div>

<div id="hitline"></div>

<div id="touch-area">
<button class="touch" data-key="0"></button>
<button class="touch" data-key="1"></button>
<button class="touch" data-key="2"></button>
<button class="touch" data-key="3"></button>
</div>
</div>

<script src="chart.js"></script>
<script src="game.js"></script>
</body>
</html>
